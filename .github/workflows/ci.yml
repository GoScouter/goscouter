name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3)'
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26.4'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || (echo "::error::go.mod/go.sum are not tidy — run 'make tidy'" && exit 1)

      - name: go vet
        run: make vet

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        shell: bash
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.event.inputs.version || format('dev-{0}', github.sha) }}
        run: make release-build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gs-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/bin/gs-*
          if-no-files-found: error

  release:
    name: Release ${{ github.event.inputs.version }}
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gs-*
          path: dist/bin
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist/bin
        run: sha256sum gs-* > checksums.txt

      - name: Extract changelog section
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          section="${VERSION#v}"

          # Print everything between "## [<section>]" and the next "## [" heading,
          # stopping early at the link-reference definitions at the bottom.
          awk -v ver="$section" '
            /^## \[/ {
              if (found) exit
              heading = $0
              sub(/^## \[/, "", heading)
              sub(/\].*$/, "", heading)
              if (heading == ver) found = 1
              next
            }
            found && /^\[[^]]+\]:/ { exit }
            found { print }
          ' CHANGELOG.md \
            | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section for '${section}'. Add a '## [${section}] - <date>' entry before releasing."
            exit 1
          fi

          echo "Release notes for ${VERSION}:"
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/bin/gs-*
            dist/bin/checksums.txt
